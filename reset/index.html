<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Reset — 12-Week Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reset">
<meta name="theme-color" content="#0b0e12">
<style>
  :root{
    --bg:#0b0e12; --surface1:#14181e; --surface2:#181c22; --surface3:#1f242c; --surface-bright:#292f38; --surface-lowest:#0b0e12;
    --text:#e1e2e8; --text-dim:#9aa0aa;
    --primary:#ff4800; --primary-hover:#ff5500; --primary-dark:#e04a00; --primary-dim:#3d1a00;
    --cyan:#00f0ff; --cyan-dim:#063338;
    --fail:#ff3b30;
    --outline:#5d6370; --outline-variant:#363f4d;
    --line:#272e38;
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;vertical-align:middle;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:90px;}
  h1,h2,h3{font-family:var(--font-display);letter-spacing:.01em;margin:0;text-transform:uppercase;}
  ::selection{background:var(--primary);color:#fff;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  input[type=number]{font-variant-numeric:tabular-nums;}

  header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 0 16px;}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .brand .logo{display:flex;align-items:center;gap:8px;}
  .brand .mark{width:32px;height:32px;flex:0 0 auto;display:block;}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:.02em;}
  .brand span{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:.05em;text-transform:uppercase;}
  .headerbtns{display:flex;align-items:center;gap:8px;}
  .statuschip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--surface3);border-radius:4px;padding:4px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--cyan);white-space:nowrap;}
  .statuschip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulseDot 1.6s ease-in-out infinite;}
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.4;}}
  .save-btn,.gear-btn{background:var(--surface3);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 38px;padding:0;overflow:hidden;}
  .save-btn{background:var(--primary);color:#fff;border-color:var(--primary);}
  .save-btn .material-symbols-outlined,.gear-btn .material-symbols-outlined{font-size:18px;}
  .sessionbadge{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--primary-dim);border-radius:4px;padding:6px 10px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text);text-transform:uppercase;margin-bottom:12px;}
  .sessionbadge .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:0 0 auto;}
  .sessionbadge .accent{color:var(--primary);}

  #bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:8px;background:rgba(11,13,15,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)) 16px;}
  #bottomnav:empty{display:none;}
  .navitem{flex:0 1 140px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:1px solid transparent;border-radius:4px;padding:8px 16px;color:var(--text-dim);cursor:pointer;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.06em;}
  .navitem .material-symbols-outlined{font-size:22px;}
  .navitem.active{background:var(--surface2);border-color:var(--primary-dim);color:var(--primary);}

  .daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .daytabs::-webkit-scrollbar{display:none;}
  .daytab{flex:0 0 auto;padding:8px 14px;border-radius:4px;background:var(--surface1);color:var(--text-dim);font-size:12px;font-weight:700;border:1px solid var(--line);cursor:pointer;white-space:nowrap;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
  .daytab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  main{padding:18px 16px 0 16px;max-width:640px;margin:0 auto;}

  .banner{background:var(--surface1);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--text-dim);margin-bottom:18px;}
  .banner b{color:var(--cyan);}
  .hydrate{display:flex;align-items:center;gap:10px;background:var(--surface1);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:4px;padding:10px 14px;font-size:13px;color:var(--text-dim);margin-bottom:14px;}
  .hydrate .icon{font-size:16px;flex:0 0 auto;}

  .daytitle h2{font-size:26px;}
  .daysub{color:var(--text-dim);font-size:13px;margin-bottom:16px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}

  .stopwatch{display:flex;align-items:center;justify-content:space-between;background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:12px 16px;margin-bottom:18px;}
  .stopwatch .time{font-family:var(--font-mono);font-size:26px;font-variant-numeric:tabular-nums;color:var(--primary);font-weight:700;}
  .stopwatch .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);}
  .stopwatch .controls{display:flex;gap:8px;}
  .iconbtn{background:var(--surface3);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}

  section.block{margin-bottom:22px;}
  .blockhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0 10px 0;}
  .blockhead h3{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;font-family:var(--font-mono);font-weight:600;}
  .blockhead .chev{color:var(--text-dim);transition:transform .2s;}
  .blockhead.collapsed .chev{transform:rotate(-90deg);}
  .blockbody{display:flex;flex-direction:column;gap:10px;}
  .blockbody.collapsed{display:none;}

  .mini{display:flex;align-items:center;gap:12px;background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .mini .miniinfo{flex:1;min-width:0;}
  .mini .mininame{font-size:14px;font-weight:600;}
  .mini .minisub{font-size:12px;color:var(--text-dim);}
  .mini .minitimer{font-family:var(--font-mono);font-size:15px;min-width:48px;text-align:right;font-variant-numeric:tabular-nums;color:var(--cyan);}
  .mini button{background:var(--surface3);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto;font-family:var(--font-mono);text-transform:uppercase;}
  .mini.done{opacity:.5;}
  .mini.done .mini-startbtn{background:var(--primary);color:#fff;border-color:var(--primary);}

  .card{background:var(--surface1);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .card-eyebrow{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 0 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card-eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);display:inline-block;}
  .card-visual{background:var(--surface2);display:flex;align-items:center;justify-content:center;padding:10px;margin:10px 16px 0 16px;border-radius:4px;}
  .look-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--cyan);border-radius:4px;padding:10px;font-size:11px;font-weight:700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;margin:8px 0 10px 0;}
  .look-btn:active{background:var(--surface3);}
  .card-visual svg{width:120px;height:140px;}
  .card-visual img{width:120px;height:140px;object-fit:contain;border-radius:4px;}
  .swap-row{display:flex;gap:2px;margin:0 16px;border-bottom:1px solid var(--line);}
  .swap-link{flex:1;text-align:center;font-size:10.5px;color:var(--text-dim);background:none;border:none;cursor:pointer;padding:9px 4px;width:100%;font-family:var(--font-mono);text-transform:uppercase;}
  .upload-label{position:relative;overflow:hidden;display:block;}
  .card-body{padding:14px 16px 16px 16px;}
  .card-body h3{font-size:24px;margin-bottom:6px;line-height:1.1;}
  .tags{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:700;background:var(--surface2);color:var(--primary);border:1px solid var(--primary-dim);border-radius:3px;padding:3px 7px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--font-mono);}
  .meta{font-size:12px;color:var(--text-dim);margin:0 0 10px 0;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .cues{margin:0 0 10px 0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--text);}
  .cues li{margin-bottom:2px;}
  .safety-box{background:var(--cyan-dim);border:1px solid var(--line);border-left:3px solid var(--cyan);border-radius:4px;padding:8px 10px 8px 12px;margin-bottom:10px;}
  .safety-box .label{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px;font-family:var(--font-mono);}
  .safety-box ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.5;color:var(--text-dim);}
  .upnext{font-size:11px;color:var(--text-dim);padding:8px 0 4px 0;border-top:1px dashed var(--line);margin-top:2px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .upnext b{color:var(--text);}

  /* simple binary tracker (bodyweight / band / TRX / medball exercises) */
  .tracker{border-top:1px solid var(--line);padding-top:12px;}
  .set-dots{display:flex;gap:6px;margin-bottom:10px;}
  .dot{width:26px;height:8px;border-radius:2px;background:var(--surface2);border:1px solid var(--line);}
  .dot.filled{background:var(--primary);border-color:var(--primary);}
  .track-row{display:flex;gap:10px;align-items:center;}
  .btn-primary{flex:1;background:var(--primary);color:#fff;border:none;border-radius:4px;padding:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;}
  .btn-primary:disabled{background:var(--surface2);color:var(--text-dim);}
  .rest-panel{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--cyan-dim);border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-top:10px;}
  .rest-panel.show{display:flex;}
  .rest-panel .resttime{font-family:var(--font-mono);font-size:22px;color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:700;}
  .rest-panel .restlabel{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-mono);}
  .rest-adjust-row{display:flex;gap:6px;}
  .rest-adjust-row .iconbtn{padding:8px 10px;font-size:11px;}
  .btn-skip{background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:4px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;}

  /* rich load/reps/RPE tracker (loadable equipment) */
  .setpanel{border-top:1px solid var(--line);padding-top:14px;}
  .setpanel-status{display:inline-block;background:var(--primary-dim);color:var(--primary);font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:5px 10px;border-radius:3px;margin-bottom:10px;}
  .loadrep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .stat-block{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .stat-label{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;margin-bottom:6px;}
  .stat-label .target{color:var(--cyan);}
  .stat-value{display:flex;align-items:baseline;gap:4px;margin-bottom:8px;}
  .stat-value input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--font-mono);font-size:28px;font-weight:700;padding:0;-moz-appearance:textfield;}
  .stat-value input::-webkit-outer-spin-button,.stat-value input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stat-value .unit{font-family:var(--font-mono);font-size:13px;color:var(--text-dim);}
  .stepper-row{display:flex;gap:6px;}
  .stepper-row button{flex:1;background:var(--surface3);border:1px solid var(--line);color:var(--text);border-radius:3px;padding:8px 0;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-mono);}
  .platecalc{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .platecalc b{color:var(--text);font-family:var(--font-mono);}
  .platecalc .barlabel{font-family:var(--font-mono);color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .btn-log{width:100%;background:var(--primary);color:#fff;border:none;border-radius:4px;padding:16px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .btn-log:disabled{background:var(--surface2);color:var(--text-dim);}
  .rpe-picker{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;display:none;}
  .rpe-picker.show{display:block;}
  .rpe-q{font-size:13px;font-weight:600;margin-bottom:10px;}
  .rpe-chips{display:flex;gap:6px;}
  .rpe-chip{flex:1;background:var(--surface3);border:1px solid var(--line);color:var(--text);border-radius:3px;padding:10px 2px;font-size:11px;font-weight:700;cursor:pointer;text-align:center;font-family:var(--font-mono);}
  .rpe-chip small{display:block;font-size:8.5px;color:var(--text-dim);font-weight:500;margin-top:2px;}
  .rpe-chip.fail{border-color:var(--fail);color:var(--fail);}
  .quick-feedback-row{display:flex;gap:6px;margin-bottom:10px;}
  .quick-fb{flex:1;border-radius:4px;padding:12px 4px;font-size:11px;font-weight:700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.02em;cursor:pointer;border:1.5px solid var(--line);background:var(--surface3);color:var(--text);}
  .quick-fb.too-much:active{background:var(--fail);border-color:var(--fail);color:#fff;}
  .quick-fb.just-right:active{background:var(--cyan);border-color:var(--cyan);color:#052024;}
  .quick-fb.too-light:active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .rpe-finegrain-label{font-size:9.5px;font-family:var(--font-mono);color:var(--text-dim);text-align:center;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .adjust-note{display:flex;align-items:center;gap:6px;background:var(--primary-dim);border:1px solid var(--primary);border-radius:4px;padding:9px 12px;margin-bottom:10px;font-size:11.5px;color:var(--primary);font-family:var(--font-mono);line-height:1.4;}
  .adjust-note svg{flex:0 0 auto;}
  .rest-upnext{display:flex;align-items:center;gap:6px;font-size:11.5px;font-family:var(--font-mono);color:var(--text-dim);padding:8px 0;border-top:1px dashed var(--line);margin-top:4px;}
  .rest-upnext b{color:var(--text);}
  .rest-upnext svg{flex:0 0 auto;color:var(--cyan);}
  .live-adjust-row{display:flex;gap:6px;margin-bottom:6px;}
  .live-adjust-row .quick-fb{padding:11px 4px;font-size:10.5px;}
  .live-adjust-confirm{text-align:center;font-size:11px;font-family:var(--font-mono);color:var(--cyan);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em;}
  .setlog{display:flex;flex-direction:column;gap:6px;}
  .setrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:3px;padding:9px 12px;font-family:var(--font-mono);font-size:12.5px;}
  .setrow .n{width:22px;height:22px;border-radius:3px;background:var(--surface3);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:0 0 auto;}
  .setrow.current{border-color:var(--primary);}
  .setrow.current .n{background:var(--primary);color:#fff;}
  .setrow.done .n{background:var(--cyan);color:#052024;}
  .setrow .setinfo{flex:1;padding:0 10px;color:var(--text);}
  .setrow.pending .setinfo{color:var(--text-dim);}
  .setrow .rpelabel{color:var(--cyan);font-weight:700;}
  .setrow .rpelabel.fail{color:var(--fail);}
  .setcomplete{text-align:center;padding:14px;color:var(--cyan);font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:var(--cyan-dim);border-radius:4px;border:1px solid var(--line);}
  .rpe-inline-btn{background:var(--surface3);border:1px solid var(--cyan);color:var(--cyan);border-radius:3px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;}

  .hudnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px 0;}
  .hudnav-pos{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .hudnav .iconbtn{display:flex;align-items:center;gap:4px;}
  .hudnav .iconbtn:disabled{opacity:.35;}
  .hudnav .material-symbols-outlined{font-size:16px;}

  .planrow{display:flex;align-items:center;gap:10px;background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;}
  .planrow-swap{flex:0 0 auto;background:var(--surface3);border:1px solid var(--line);color:var(--cyan);border-radius:4px;padding:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .shuffle-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);color:var(--cyan);border-radius:4px;padding:6px 10px;font-size:10px;font-weight:700;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;}
  .planrow-n{width:24px;height:24px;border-radius:3px;background:var(--surface3);color:var(--text-dim);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;flex:0 0 auto;}
  .planrow-info{flex:1;min-width:0;}
  .planrow-name{font-size:14px;font-weight:600;}
  .planrow-sub{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.02em;}
  .planbadge{font-family:var(--font-mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:3px;flex:0 0 auto;}
  .planbadge.pending{background:var(--surface3);color:var(--text-dim);}
  .planbadge.inprogress{background:var(--primary-dim);color:var(--primary);}
  .planbadge.complete{background:var(--cyan-dim);color:var(--cyan);}

  .restempty{text-align:center;padding:60px 20px;color:var(--text-dim);}
  .restempty h3{font-size:18px;color:var(--text);margin:14px 0 6px 0;}
  .restempty p{font-size:13px;line-height:1.5;margin-bottom:20px;}
  .restempty .btn-log{max-width:220px;margin:0 auto;}

  .restscreen{background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:20px;text-align:center;}

  .upnextcard{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin:14px 0;text-align:left;}

  .cardio-card img{width:80px;height:96px;object-fit:contain;border-radius:4px;background:var(--surface2);}

  .cardio-timer{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:4px;padding:12px 16px;margin-bottom:12px;}

  .cardio-timer .btns{display:flex;gap:8px;}
  .cardio-timer button{background:transparent;border:1px solid var(--cyan);color:var(--cyan);border-radius:4px;padding:8px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);text-transform:uppercase;}

  footer{max-width:640px;margin:20px auto 0 auto;padding:0 16px 30px 16px;color:var(--text-dim);font-size:11px;line-height:1.6;text-align:center;font-family:var(--font-mono);}

  /* onboarding — matched to Stitch's tile/bento/chip vocabulary */
  .ob-hero-eyebrow{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:11px;font-family:var(--font-mono);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}

  .ob-hero h1{font-size:30px;letter-spacing:-.01em;line-height:1;margin-bottom:6px;}
  .ob-hero p{color:var(--text-dim);font-size:11.5px;font-family:var(--font-mono);line-height:1.5;margin:0;}
  .ob-section{margin-bottom:20px;}
  .ob-eyebrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}

  .ob-eyebrow-badge{font-size:9.5px;font-family:var(--font-mono);background:var(--surface3);color:var(--text-dim);border:1px solid var(--line);padding:2px 6px;border-radius:3px;}
  .ob-subhead{font-size:11px;font-family:var(--font-mono);color:var(--text);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:10px 0 8px 0;}

  .tile{cursor:pointer;padding:12px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);transition:opacity .15s;}

  .tile-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .tile-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .tile-col-span-2{grid-column:span 2;text-align:center;}
  .tile-stack{display:flex;flex-direction:column;gap:8px;}
  .tile-tier{font-size:9.5px;font-family:var(--font-mono);color:var(--text-dim);text-transform:uppercase;}
  .tile.active .tile-tier{color:var(--primary);font-weight:700;}
  .tile-title{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;color:var(--text);}

  .tile-title.md{font-size:15px;line-height:1.1;margin-top:2px;}
  .tile-sub{font-size:10px;font-family:var(--font-mono);color:var(--text-dim);margin-top:3px;}

  .tile-icon-box{width:32px;height:32px;border-radius:4px;background:var(--surface3);border:1px solid var(--line);color:var(--text-dim);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

  .tile-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--outline);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .tile.active .tile-radio{border-color:var(--primary);}

  .tile-selected-tag{position:absolute;bottom:6px;right:10px;font-size:9px;font-family:var(--font-mono);font-weight:700;color:var(--primary);text-transform:uppercase;}
  .tile-sextop{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .tile-sextop span:first-child{font-size:10px;font-family:var(--font-mono);font-weight:700;color:var(--text-dim);text-transform:uppercase;}
  .tile.active .tile-sextop span:first-child{color:var(--primary);}

  .bento-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat-card{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px;}
  .stat-card-top{display:flex;justify-content:space-between;font-size:9.5px;font-family:var(--font-mono);color:var(--text-dim);text-transform:uppercase;letter-spacing:.02em;margin-bottom:8px;}
  .stat-card-top .u{color:var(--cyan);font-weight:700;}
  .stat-card-top .u.warm{color:var(--primary);font-weight:700;}
  .stat-card input{width:100%;text-align:center;background:var(--surface3);border:1px solid var(--line);color:var(--text);font-family:var(--font-mono);font-weight:800;font-size:20px;border-radius:4px;padding:5px 0;margin-bottom:8px;-moz-appearance:textfield;}
  .stat-card input:focus{outline:none;border-color:var(--cyan);}
  .stat-card .steprow{display:flex;gap:6px;}
  .stat-card .steprow button{flex:1;background:var(--surface3);border:1px solid var(--line);color:var(--text-dim);border-radius:3px;padding:6px 0;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--font-mono);}
  .bento-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .bento-2 .stat-card{position:relative;}
  .bento-2 .stat-card input{font-size:19px;padding:7px 0;}
  .stat-caption{font-size:9.5px;font-family:var(--font-mono);color:var(--text-dim);text-align:center;}
  .stat-caption b{color:var(--primary);}
  .stat-caption b.cy{color:var(--cyan);}
  .sleep-row{background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sleep-row-label{font-size:10px;font-family:var(--font-mono);color:var(--cyan);text-transform:uppercase;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:5px;}
  .sleep-row-sub{font-size:11px;font-family:var(--font-mono);color:var(--text-dim);margin-top:2px;}
  .sleep-row input{width:54px;text-align:center;background:var(--surface3);border:1px solid var(--line);color:var(--text);font-family:var(--font-mono);font-weight:700;font-size:15px;border-radius:4px;padding:5px 0;}

  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:8px 12px;border-radius:4px;background:var(--surface3);border:1px solid var(--line);color:var(--text-dim);font-size:11.5px;cursor:pointer;font-family:var(--font-mono);font-weight:700;text-transform:uppercase;letter-spacing:.01em;}
  .chip.checked{background:var(--primary);color:#fff;border-color:var(--primary);}
  .eq-search-input{width:100%;background:var(--surface1);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:10px 12px;font-size:13px;margin-bottom:10px;font-family:var(--font-body);}
  .eq-search-input:focus{outline:none;border-color:var(--cyan);}
  .eq-list{display:flex;flex-direction:column;gap:6px;}
  .eq-row{display:flex;gap:6px;align-items:stretch;}
  .eq-row .eq-item{flex:1;}
  .eq-confirm-btn{flex:0 0 auto;width:36px;display:flex;align-items:center;justify-content:center;background:var(--surface3);border:1px solid var(--line);color:var(--cyan);border-radius:4px;cursor:pointer;}
  .eq-item{display:inline-flex;align-items:center;gap:6px;background:var(--surface3);border:1px solid var(--line);color:var(--text-dim);border-radius:4px;padding:8px 10px;cursor:pointer;font-size:10.5px;font-family:var(--font-mono);font-weight:700;}
  .eq-item.checked{background:var(--primary);color:#fff;border-color:var(--primary);}
  .eq-item .material-symbols-outlined{font-size:13px;opacity:.4;}
  .eq-item.checked .material-symbols-outlined{opacity:1;}
  .waist-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .waist-2 .stat-card-top{margin-bottom:6px;}
  .waist-2 input{font-size:15px;padding:6px 0;margin-bottom:0;}

  .ob-readycard{background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;gap:10px;margin-bottom:16px;}
  .ob-readycard .material-symbols-outlined{color:var(--primary);font-size:20px;}
  .ob-readycard-title{font-size:11px;font-family:var(--font-mono);font-weight:700;color:var(--text);text-transform:uppercase;}
  .ob-readycard-sub{font-size:10px;font-family:var(--font-mono);color:var(--text-dim);margin-top:3px;line-height:1.5;}
  .feasibility-card{display:flex;gap:10px;background:var(--surface1);border:1.5px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;}
  .feasibility-label{font-size:11px;font-family:var(--font-mono);font-weight:700;margin-bottom:3px;letter-spacing:.03em;}
  .feasibility-text{font-size:11.5px;font-family:var(--font-mono);color:var(--text-dim);line-height:1.5;}

  .ob-continue{width:100%;background:var(--primary);color:#fff;border:none;border-radius:4px;padding:16px;font-size:16px;font-weight:800;cursor:pointer;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 24px rgba(255,72,0,.35);}
  .ob-footnote{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:9.5px;font-family:var(--font-mono);color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
  .ob-footnote .dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);}
  .ob-progress{padding:16px 0 6px 0;}
  .ob-progress-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:8px;}
  .ob-progress-fill{height:100%;background:var(--primary);transition:width .35s ease;}
  .ob-progress-label{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;text-align:center;}
  .ob-stepwrap{min-height:200px;}
  @keyframes obSlideInR{0%{opacity:0;transform:translateX(24px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes obSlideInL{0%{opacity:0;transform:translateX(-24px);}100%{opacity:1;transform:translateX(0);}}
  .ob-stepwrap.slide-in-r{animation:obSlideInR .32s ease;}
  .ob-stepwrap.slide-in-l{animation:obSlideInL .32s ease;}
  .ob-navrow{display:flex;gap:10px;margin:22px 0 10px 0;}
  .ob-step-error{background:rgba(255,59,48,.1);border:1.5px solid var(--fail);border-radius:4px;padding:10px 14px;margin-top:14px;font-size:12px;font-family:var(--font-mono);color:var(--fail);line-height:1.5;}
  .ob-navbtn{flex:1;border-radius:4px;padding:16px;font-size:14px;font-weight:800;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;}
  .ob-navbtn.primary{background:var(--primary);color:#fff;box-shadow:0 0 24px rgba(255,72,0,.35);flex:2;}
  .ob-navbtn.ghost{background:var(--surface2);color:var(--text-dim);border:1px solid var(--line);flex:1;}
  .whyplan{background:var(--surface1);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:4px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.6;color:var(--text-dim);}
  .whyplan b{color:var(--text);}

  /* fuel tab */
  .fuel-top{display:flex;gap:16px;align-items:center;background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:18px;margin-bottom:16px;}
  .ring{width:120px;height:120px;border-radius:50%;flex:0 0 auto;background:conic-gradient(var(--primary) calc(var(--pct)*1%), var(--surface3) 0);display:flex;align-items:center;justify-content:center;position:relative;}
  .ring::before{content:'';position:absolute;inset:10px;background:var(--surface1);border-radius:50%;}
  .ring-inner{position:relative;text-align:center;}
  .ring-inner .val{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--text);display:block;}
  .ring-inner .lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;}
  .fuel-stats{flex:1;}
  .fuel-stats .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--text-dim);font-family:var(--font-mono);}
  .fuel-stats .row b{color:var(--text);}
  .macro-bars{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
  .macro-bar-row{background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .macro-bar-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;color:var(--text-dim);}
  .macro-bar-label b{color:var(--text);}
  .macro-bar-track{height:8px;background:var(--surface3);border-radius:2px;overflow:hidden;}
  .macro-bar-fill{height:100%;border-radius:2px;}
  .quickadd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .quickadd-tile{background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;text-align:left;}
  .quickadd-tile .qname{font-size:12.5px;font-weight:600;margin-bottom:2px;}
  .quickadd-tile .qmeta{font-size:10.5px;color:var(--text-dim);font-family:var(--font-mono);}
  .quickadd-tile .qtap{float:right;color:var(--primary);font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;}
  .fuel-log-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;}
  .fuel-log-row .rmbtn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:0 4px;}
  .hydro-track{display:flex;gap:4px;margin-bottom:10px;}
  .hydro-seg{flex:1;height:20px;background:var(--surface3);border-radius:2px;}
  .hydro-seg.filled{background:var(--cyan);}
  .custom-fuel{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:6px;margin-bottom:10px;}
  .custom-fuel input{background:var(--surface1);border:1px solid var(--line);color:var(--text);border-radius:4px;padding:8px;font-size:12px;width:100%;}
  .mealday{background:var(--surface1);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:10px;}
  .mealday h4{font-size:14px;margin-bottom:8px;font-family:var(--font-display);text-transform:uppercase;}
  .mealrow{font-size:13px;line-height:1.6;color:var(--text);}
  .mealrow b{color:var(--text-dim);font-weight:600;display:inline-block;width:76px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;}

  .figure .part{stroke:var(--text);stroke-width:5;stroke-linecap:round;fill:none;}
  .figure .head{fill:var(--text);stroke:none;}
  .figure .glow{fill:var(--primary);opacity:0;}
  .figure.cat-squat .rig{animation:squatBob 2.4s ease-in-out infinite;}
  .figure.cat-squat .thighL,.figure.cat-squat .thighR{animation:squatThigh 2.4s ease-in-out infinite;}
  .figure.cat-squat .shinL,.figure.cat-squat .shinR{animation:squatShin 2.4s ease-in-out infinite;}
  @keyframes squatBob{0%,100%{transform:translateY(0);}50%{transform:translateY(10px);}}
  @keyframes squatThigh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(30deg);}}
  @keyframes squatShin{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-45deg);}}
  .figure.cat-hinge .torso{animation:hingeTorso 2.6s ease-in-out infinite;transform-origin:50px 68px;}
  .figure.cat-hinge .armGroup{animation:hingeTorso 2.6s ease-in-out infinite;transform-origin:50px 68px;}
  .figure.cat-hinge .thighL,.figure.cat-hinge .thighR{animation:hingeThigh 2.6s ease-in-out infinite;}
  @keyframes hingeTorso{0%,100%{transform:rotate(0deg);}50%{transform:rotate(38deg);}}
  @keyframes hingeThigh{0%,100%{transform:rotate(0deg);}50%{transform:rotate(8deg);}}
  .figure.cat-press .upperArmL,.figure.cat-press .upperArmR{animation:pressUpper 2.2s ease-in-out infinite;}
  .figure.cat-press .foreArmL,.figure.cat-press .foreArmR{animation:pressFore 2.2s ease-in-out infinite;}
  @keyframes pressUpper{0%,100%{transform:rotate(-55deg);}50%{transform:rotate(-5deg);}}
  @keyframes pressFore{0%,100%{transform:rotate(70deg);}50%{transform:rotate(5deg);}}
  .figure.cat-pull .upperArmL,.figure.cat-pull .upperArmR{animation:pullUpper 2.2s ease-in-out infinite;}
  .figure.cat-pull .foreArmL,.figure.cat-pull .foreArmR{animation:pullFore 2.2s ease-in-out infinite;}
  @keyframes pullUpper{0%,100%{transform:rotate(-70deg);}50%{transform:rotate(-15deg);}}
  @keyframes pullFore{0%,100%{transform:rotate(-40deg);}50%{transform:rotate(10deg);}}
  .figure.cat-core .glow{animation:corePulse 2.2s ease-in-out infinite;}
  @keyframes corePulse{0%,100%{opacity:.08;}50%{opacity:.35;}}
  .figure.cat-cardio .thighL{animation:cardioThighL 1.1s ease-in-out infinite;}
  .figure.cat-cardio .thighR{animation:cardioThighR 1.1s ease-in-out infinite;}
  .figure.cat-cardio .upperArmL{animation:cardioArmL 1.1s ease-in-out infinite;}
  .figure.cat-cardio .upperArmR{animation:cardioArmR 1.1s ease-in-out infinite;}
  @keyframes cardioThighL{0%,100%{transform:rotate(-22deg);}50%{transform:rotate(22deg);}}
  @keyframes cardioThighR{0%,100%{transform:rotate(22deg);}50%{transform:rotate(-22deg);}}
  @keyframes cardioArmL{0%,100%{transform:rotate(20deg);}50%{transform:rotate(-20deg);}}
  @keyframes cardioArmR{0%,100%{transform:rotate(-20deg);}50%{transform:rotate(20deg);}}
  @media (prefers-reduced-motion: reduce){.figure *{animation:none !important;}}

  #app-splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:splashOut .5s ease forwards;animation-delay:1.1s;}
  #app-splash svg{animation:splashLogoIn .6s cubic-bezier(.2,.9,.3,1.3) forwards;}
  #app-splash-word{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:.18em;color:var(--text);opacity:0;animation:splashWordIn .5s ease forwards;animation-delay:.35s;}
  @keyframes splashLogoIn{0%{opacity:0;transform:scale(.7);}100%{opacity:1;transform:scale(1);}}
  @keyframes splashWordIn{0%{opacity:0;transform:translateY(6px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes splashOut{0%{opacity:1;visibility:visible;}99%{opacity:0;visibility:visible;}100%{opacity:0;visibility:hidden;pointer-events:none;}}
</style>
</head>

function bumpVerdict(v, up){ const o=["safe","ambitious","risky"]; const i=o.indexOf(v); return i===-1?v:o[Math.min(o.length-1,Math.max(0,i+(up?1:-1)))]; }
function computeFeasibility(overrides){
  const p = Object.assign({}, profile, overrides||{});
  const w = parseFloat(p.weight), tw = parseFloat(p.targetWeight), wk = parseFloat(p.targetWeeks);
  if(!w || !tw || !wk) return null;
  const delta = tw - w;
  if(p.goal === "gain"){
    return {verdict:"safe", text:`Building muscle at a measured pace over ${wk} weeks — patience beats rushing here.`};
  }
  if(Math.abs(delta) < 0.5) return {verdict:"safe", text:"Your target and current weight are basically the same — this plan will focus on recomposition, not the scale."};
  const avgRateKg = Math.abs(delta) / wk;
  let verdict = avgRateKg <= 0.75 ? "safe" : avgRateKg <= 1.1 ? "ambitious" : "risky";
  let text = delta < 0
    ? `Aiming for ${Math.abs(delta).toFixed(1)}kg down over ${wk} weeks — about ${avgRateKg.toFixed(2)}kg/week.`
    : `Aiming for ${delta.toFixed(1)}kg up over ${wk} weeks — about ${avgRateKg.toFixed(2)}kg/week.`;
  if(verdict === "risky") text += " That's faster than most people can sustain safely — consider a longer timeframe.";
  else if(verdict === "ambitious") text += " Doable, but it'll take consistency — a slightly longer timeframe would be gentler.";
  else text += " A sustainable, well-supported pace.";
  const days = parseInt(p.daysPerWeek), mins = parseInt(p.minutesAvailable);
  if(days && mins){
    const weeklyMinutes = days*mins;
    if(weeklyMinutes < 60){ verdict = bumpVerdict(verdict, true); text += ` Also — ${days}× ${mins}min/week is only ${weeklyMinutes} min total, light for this pace.`; }
  }
  return {verdict, text};
}

/* ================= Suggestion engine ================= */
function preferenceOrder(level){
  if(level === "advanced") return ["Advanced","Intermediate","Beginner"];
  if(level === "beginner") return ["Beginner","Intermediate","Advanced"];
  return ["Intermediate","Advanced","Beginner"];
}
function pickForSlot(slot, usedNames, randomize){
  let candidates = EXERCISES.filter(e=>e.slot===slot && (e.eq==="none" || equipmentSelected.has(e.eq)) && !usedNames.has(e.name));
  let nonNone = candidates.filter(e=>e.eq!=="none");
  let pool = nonNone.length ? nonNone : candidates;
  const order = preferenceOrder(profile.experience || "intermediate");
  for(const lvl of order){
    const match = pool.filter(e=>e.diff===lvl);
    if(match.length) return randomize ? match[Math.floor(Math.random()*match.length)] : match[0];
  }
  if(pool.length) return randomize ? pool[Math.floor(Math.random()*pool.length)] : pool[0];
  // relax the "already used" restriction as a last resort
  candidates = EXERCISES.filter(e=>e.slot===slot && (e.eq==="none" || equipmentSelected.has(e.eq)));
  return candidates.length ? candidates[0] : EXERCISES.find(e=>e.slot===slot);
}
const TIER = {
  beginner:    {sets:3, reps:"10–12", rest:75, isoRest:60, coreHold:"30–45s hold", carryDist:"20–30m walk", cue2:"Start light and focus on form before adding weight."},
  intermediate:{sets:4, reps:"8–12",  rest:60, isoRest:50, coreHold:"45–60s hold", carryDist:"30–40m walk", cue2:"Progress the load steadily once form is consistent."},
  advanced:    {sets:4, reps:"6–10",  rest:60, isoRest:45, coreHold:"60–90s hold", carryDist:"40–60m walk", cue2:"Push intensity while keeping technique tight under fatigue."},
};
function buildDayPlan(def, randomize){
  const tier = TIER[profile.experience || "intermediate"];
  if(def.type === "cardio"){
    const used = new Set();
    const segs = [];
    for(let i=0;i<2;i++){
      const pick = pickForSlot("cardio", used, randomize);
      used.add(pick.name);
      segs.push({...pick, sec: 300});
    }
    return {...def, segments: segs};
  }
  const used = new Set();
  const exercises = def.slots.map(slot=>{
    const pick = pickForSlot(slot, used, randomize);
    used.add(pick.name);
    const isCore = slot === "core";
    const isCarry = slot === "carry";
    return {
      ...pick,
      sets: tier.sets,
      reps: isCore ? tier.coreHold : isCarry ? tier.carryDist : tier.reps,
      rest: (slot==="isolation") ? tier.isoRest : (isCore||isCarry) ? Math.round(tier.rest*0.6) : tier.rest,
      cue2: tier.cue2,
    };
  });
  if(profile.focusAreas && profile.focusAreas.length){
    const strengthOrder = ["mon","wed","fri"];
    const dayIdx = strengthOrder.indexOf(def.id);
    const chosenArea = profile.focusAreas[dayIdx % profile.focusAreas.length];
    const focusEx = EXERCISES.find(e=>e.slot==="focus" && e.focusArea===chosenArea);
    if(focusEx && !used.has(focusEx.name)){
      const isCore = focusEx.cat === "core";
      exercises.push({
        ...focusEx,
        sets: tier.sets,
        reps: isCore ? tier.coreHold : tier.reps,
        rest: isCore ? Math.round(tier.rest*0.6) : tier.isoRest,
        cue2: `Today's target-focus move, aimed at your ${FOCUS_OPTIONS.find(f=>f.id===chosenArea)?.label.toLowerCase()||chosenArea}.`,
        isFocus: true,
      });
    }
  }
  return {...def, exercises};
}
function regeneratePlans(){
  generatedPlans = {};
  DAY_DEFS.forEach(d=>{ generatedPlans[d.id] = buildDayPlan(d); });
}
function clearDayTrackerState(dayId){
  Object.keys(richTrackers).forEach(k=>{ if(k.startsWith(dayId+'-ex')) delete richTrackers[k]; });
  Object.keys(simpleTrackers).forEach(k=>{ if(k.startsWith(dayId+'-ex')) delete simpleTrackers[k]; });
  if(activeRest && activeRest.cardId && activeRest.cardId.startsWith(dayId+'-ex')){
    clearInterval(activeRest.interval); activeRest = null;
  }
}
function shuffleDayPlan(dayId){
  const def = DAY_DEFS.find(d=>d.id===dayId);
  if(!def || def.type === "cardio") return; // cardio days have less to shuffle meaningfully
  generatedPlans[dayId] = buildDayPlan(def, true);
  clearDayTrackerState(dayId);
  hudIndexByDay[dayId] = 0;
  saveState();
  renderHeader(); renderMain();
}
function swapOneExercise(dayId, exIndex){
  const def = DAY_DEFS.find(d=>d.id===dayId);
  const plan = generatedPlans[dayId];
  if(!def || !plan || !plan.exercises) return;
  const current = plan.exercises[exIndex];
  const isFocusExtra = !!current.isFocus;
  let pool;
  if(isFocusExtra){
    pool = EXERCISES.filter(e=>e.slot==='focus' && e.focusArea===current.focusArea);
  } else {
    const slot = def.slots[exIndex];
    const usedOther = new Set(plan.exercises.filter((_,i)=>i!==exIndex).map(e=>e.name));
    let candidates = EXERCISES.filter(e=>e.slot===slot && (e.eq==="none" || equipmentSelected.has(e.eq)) && !usedOther.has(e.name));
    const nonNone = candidates.filter(e=>e.eq!=="none");
    pool = nonNone.length ? nonNone : candidates;
  }
  if(pool.length < 2){ alert("No other alternative fits your current equipment for this slot."); return; }
  const curIdx = pool.findIndex(e=>e.name===current.name);
  const next = pool[(curIdx+1+pool.length) % pool.length];
  const tier = TIER[profile.experience || "intermediate"];
  const slot = isFocusExtra ? null : def.slots[exIndex];
  const isCore = isFocusExtra ? next.cat==='core' : slot==='core';
  const isCarry = !isFocusExtra && slot==='carry';
  plan.exercises[exIndex] = {
    ...next,
    sets: tier.sets,
    reps: isCore ? tier.coreHold : isCarry ? tier.carryDist : tier.reps,
    rest: (!isFocusExtra && slot==='isolation') ? tier.isoRest : (isCore||isCarry) ? Math.round(tier.rest*0.6) : tier.rest,
    cue2: isFocusExtra ? current.cue2 : tier.cue2,
    isFocus: isFocusExtra,
    focusArea: isFocusExtra ? current.focusArea : undefined,
  };
  const cardId = `${dayId}-ex${exIndex}`;
  delete richTrackers[cardId];
  delete simpleTrackers[cardId];
  if(activeRest && activeRest.cardId === cardId){ clearInterval(activeRest.interval); activeRest = null; }
  saveState();
  renderHeader(); renderMain();
}

function computeNutrition(){
  const w = parseFloat(profile.weight), h = parseFloat(profile.height), age = parseFloat(profile.age);
  if(!w||!h||!age) return null;
  const sexFactor = profile.sex === "male" ? 5 : -161;
  const bmr = 10*w + 6.25*h - 5*age + sexFactor;
  const actMult = {sedentary:1.2, light:1.375, moderate:1.55, athlete:1.725}[profile.activity] || 1.375;
  const tdee = bmr * actMult;
  const trendAdj = {losing:-300, stable:0, gaining:300}[profile.weightTrend] || 0;
  const GOAL = {
    lose:     {adj:-450, proteinMult:[1.8,2.2], label:"Target for gradual weight loss"},
    maintain: {adj:0,    proteinMult:[1.4,1.8], label:"Target to maintain current weight"},
    gain:     {adj:300,  proteinMult:[1.8,2.4], label:"Target to support muscle gain"},
  };
  const g = GOAL[profile.goal] || GOAL.maintain;
  return {
    tdee: Math.round(tdee),
    currentEstimate: Math.round(tdee + trendAdj),
    target: Math.round(tdee + g.adj),
    targetLabel: g.label,
    proteinLow: Math.round(w*g.proteinMult[0]),
    proteinHigh: Math.round(w*g.proteinMult[1]),
  };
}

const OB_STEPS = ['welcome','about','goal','experience','body','schedule','fuel','equipment'];
let obStep = 0;
let obDir = 1;

function renderOnboarding(){
  const stepKey = OB_STEPS[obStep];
  const stepBuilders = {
    welcome: obStepWelcome, about: obStepAbout, goal: obStepGoal, experience: obStepExperience,
    body: obStepBody, schedule: obStepSchedule, fuel: obStepFuel, equipment: obStepEquipment,
  };
  const isFirst = obStep === 0;
  const isLast = obStep === OB_STEPS.length - 1;
  const progressPct = Math.round(((obStep) / (OB_STEPS.length-1)) * 100);

  mainEl.innerHTML = `
    <div class="ob-progress">
      <div class="ob-progress-track"><div class="ob-progress-fill" style="width:${progressPct}%;"></div></div>
      <div class="ob-progress-label">STEP ${obStep+1} OF ${OB_STEPS.length}</div>
    </div>
    <div class="ob-stepwrap ${obDir>0?'slide-in-r':'slide-in-l'}" id="ob-stepwrap">
      ${stepBuilders[stepKey]()}
    </div>
    <div class="ob-step-error" id="ob-step-error" style="display:none;"></div>
    <div class="ob-navrow">
      ${isFirst ? '' : `<button class="ob-navbtn ghost" onclick="obBack()">${svgIcon('chevronLeft',15)} BACK</button>`}
      <button class="ob-navbtn primary" onclick="${isLast?'obFinish()':'obNext()'}">${isLast?'BUILD MY PLAN':'CONTINUE'} ${isLast?svgIcon('bolt',16):svgIcon('chevronRight',15)}</button>
    </div>
  `;
}
function obFinish(){
  captureStepInputs();
  const missing = validateStep(OB_STEPS[obStep]);
  if(missing.length){ showStepError(missing.join(', ')); return; }
  finishOnboarding();
}
function validateStep(stepKey){
  const missing = [];
  if(stepKey === 'about'){
    if(!profile.sex) missing.push('sex (male/female)');
    if(!profile.age) missing.push('age');
    if(!profile.height) missing.push('height');
    if(!profile.weight) missing.push('current weight');
  }
  if(stepKey === 'goal'){
    if(!profile.goal) missing.push('primary goal');
    if(!profile.weightTrend) missing.push('recent weight trend');
  }
  if(stepKey === 'experience'){
    if(!profile.experience) missing.push('training experience');
    if(!profile.activity) missing.push('activity level');
  }
  if(stepKey === 'body'){
    if(!profile.currentShape) missing.push('current build');
    if(!profile.aestheticGoal) missing.push('desired physique');
  }
  if(stepKey === 'schedule'){
    if(!profile.daysPerWeek) missing.push('days per week');
    else if(profile.selectedDays.length !== parseInt(profile.daysPerWeek)) missing.push(`which ${profile.daysPerWeek} days`);
    if(!profile.preferredTime) missing.push('best time of day');
  }
  if(stepKey === 'fuel'){
    if(!profile.dietType) missing.push('dietary pattern');
  }
  if(stepKey === 'equipment'){
    if(equipmentSelected.size === 0) missing.push('at least one piece of equipment');
  }
  return missing;
}
function showStepError(msg){
  const el = document.getElementById('ob-step-error');
  if(el){ el.textContent = `⚠ Please select: ${msg}`; el.style.display = 'block'; }
}
function captureStepInputs(){
  const map = {'ob-age':'age','ob-height':'height','ob-weight':'weight','ob-target':'targetWeight','ob-weeks':'targetWeeks','ob-sleep':'sleepHours','ob-waist-now':'waistCurrent','ob-waist-target':'waistTarget','ob-minutes':'minutesAvailable','ob-meals':'mealsPerDay'};
  Object.keys(map).forEach(id=>{
    const el = document.getElementById(id);
    if(el && el.value !== '') profile[map[id]] = el.value;
  });
}
function obNext(){
  captureStepInputs();
  const stepKey = OB_STEPS[obStep];
  const missing = validateStep(stepKey);
  if(missing.length){ showStepError(missing.join(', ')); return; }
  if(obStep < OB_STEPS.length-1){ obDir=1; obStep++; renderHeader(); renderOnboarding(); window.scrollTo(0,0); }
}
function obBack(){ captureStepInputs(); if(obStep > 0){ obDir=-1; obStep--; renderHeader(); renderOnboarding(); window.scrollTo(0,0); } }

function updateOnboardingStats(){
  const wEl = document.getElementById('ob-weight'), twEl = document.getElementById('ob-target'), wkEl = document.getElementById('ob-weeks');
  if(!wEl) return;
  const w = parseFloat(wEl.value)||0, tw = parseFloat(twEl.value)||0, wk = parseFloat(wkEl.value)||0;
  const deltaEl = document.getElementById('ob-delta-caption');
  const paceEl = document.getElementById('ob-pace-caption');
  if(deltaEl){
    if(tw && w){
      const delta = tw-w;
      deltaEl.innerHTML = `Delta: <b>${delta>0?'+':''}${delta.toFixed(1)} KG</b> ${delta<0?'deficit':delta>0?'surplus':''} target`;
    } else deltaEl.innerHTML = `Delta: <b>—</b>`;
  }
  if(paceEl){
    if(tw && w && wk){
      const pace = Math.abs((tw-w)/wk);
      paceEl.innerHTML = `Pacing: <b class="cy">~${pace.toFixed(2)} KG/WK</b> ${pace>1?'aggressive':'safe'} rate`;
    } else paceEl.innerHTML = `Pacing: <b class="cy">—</b>`;

  const feasEl = document.getElementById('ob-feasibility');

function whyPlanHTML(){
  const parts = [];

function warmupCooldownHTML(list, keyPrefix){

function currentDayList(def, plan){
  return def.type === "strength" ? plan.exercises : plan.segments;
}
function resolveFlowIndex(def, plan, idx){
  const mainList = currentDayList(def, plan);
  const wOff = stretchOpen.length;
  const mOff = wOff + warmup.length;
  const cOff = mOff + mainList.length;
  const total = cOff + cooldown.length;
  idx = Math.max(0, Math.min(total-1, idx));
  if(idx < wOff) return {phase:'stretch', sub: idx, total, idx};
  if(idx < mOff) return {phase:'warmup', sub: idx-wOff, total, idx};
  if(idx < cOff) return {phase: def.type==='strength' ? 'exercise' : 'segment', sub: idx-mOff, total, idx};
  return {phase:'cooldown', sub: idx-cOff, total, idx};
}
function flowMiniCardHTML(phaseLabel, id, item){
  const done = minisDone.has(id);
  const running = activeMini && activeMini.id === id;
  const timeText = running ? fmt(activeMini.remaining) : done ? 'DONE' : fmt(item.sec);
  let btnHTML;
  if(done) btnHTML = `<div class="setcomplete">${svgIcon('check',13)} COMPLETED — TAP NEXT TO CONTINUE</div>`;
  else if(running) btnHTML = `<button class="btn-log" onclick="skipMini('${id}')">SKIP</button>`;
  else btnHTML = `<button class="btn-log" onclick="startMini('${id}', ${item.sec})">START (${fmt(item.sec)})</button>`;
  return `
  <div class="card">
    <div class="card-eyebrow"><span>${phaseLabel}</span><span class="dot"></span><span>TIMED — NO WEIGHT</span></div>
    <div class="card-body" style="text-align:center;padding:36px 20px 30px 20px;">
      <h3 style="font-size:26px;margin-bottom:8px;">${item.name}</h3>
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:24px;">${item.sub}</p>
      <div class="restscreen-time" style="margin-bottom:18px;${done?'color:var(--cyan);':''}">${timeText}</div>
      ${btnHTML}
    </div>
  </div>`;
}

/* ---- HUD: one item at a time — stretch, warm-up, exercises, cool-down ---- */
function renderHud(){
  const def = DAY_DEFS.find(x=>x.id===activeDay);
  const plan = generatedPlans[activeDay] || buildDayPlan(def);
  const mainList = currentDayList(def, plan);
  const cur = hudIndexByDay[activeDay] || 0;
  const r = resolveFlowIndex(def, plan, cur);
  hudIndexByDay[activeDay] = r.idx;

  let html = `<div class="banner">${svgIcon("warning",15)} <b>Before you start:</b> warm up first, stop for sharp pain, dizziness or chest tightness, and only add weight once a movement feels easy with good form.</div>`;

  if(r.phase === 'stretch') html += flowMiniCardHTML('STRETCH', 'st'+r.sub, stretchOpen[r.sub]);
  else if(r.phase === 'warmup') html += flowMiniCardHTML('WARM-UP', 'wu'+r.sub, warmup[r.sub]);
  else if(r.phase === 'cooldown') html += flowMiniCardHTML('COOL-DOWN', 'cd'+r.sub, cooldown[r.sub]);
  else if(r.phase === 'exercise') html += exerciseCardHTML(mainList[r.sub], r.sub, def.id, mainList);
  else html += cardioCardHTML(mainList[r.sub], r.sub, def.id);

  html += `
    <div class="hudnav">
      <button class="iconbtn" ${r.idx===0?'disabled':''} onclick="hudMove(-1)">${svgIcon("chevronLeft",15)} PREV</button>
      <span class="hudnav-pos">${r.idx+1} / ${r.total}</span>
      <button class="iconbtn" ${r.idx===r.total-1?'disabled':''} onclick="hudMove(1)">NEXT ${svgIcon("chevronRight",15)}</button>
    </div>`;

  mainEl.innerHTML = html;

  if(r.phase === 'exercise'){
    const cardId = `${def.id}-ex${r.sub}`;
    if(richTrackerEligible(mainList[r.sub])) initRichTracker(cardId, mainList[r.sub]);
    else initSimpleTracker(cardId, mainList[r.sub].sets, mainList[r.sub].rest);
  } else if(r.phase === 'segment'){
    initCardioTimer(`${def.id}-cdt${r.sub}`, mainList[r.sub].sec);
  }
}
function hudMove(delta){
  const def = DAY_DEFS.find(x=>x.id===activeDay);
  const plan = generatedPlans[activeDay] || buildDayPlan(def);
  const cur = hudIndexByDay[activeDay] || 0;
  const r = resolveFlowIndex(def, plan, cur+delta);
  hudIndexByDay[activeDay] = r.idx;
  renderMain();
}
function jumpToHud(dayId, mainIdx){
  const offset = stretchOpen.length + warmup.length;
  activeDay = dayId; hudIndexByDay[dayId] = offset + mainIdx; topTab = 'hud';
  renderHeader(); renderMain();
}

    <div class="live-adjust-row" style="${isResting?'display:none;':''}">
      <button class="quick-fb too-much" onclick="liveAdjust('${cardId}','heavy')">😓 TOO HEAVY — LIGHTEN IT</button>
      <button class="quick-fb too-light" onclick="liveAdjust('${cardId}','light')">💪 TOO LIGHT — ADD MORE</button>
    </div>
    <div class="live-adjust-confirm" id="${cardId}-live-note" style="display:none;"></div>
    ${ex.barbell ? `<div class="platecalc" id="${cardId}-plates" style="${isResting?'display:none;':''}"></div>` : ''}
    <button class="btn-log" id="${cardId}-logbtn" style="${isResting?'display:none;':''}" onclick="onLogSet('${cardId}')">LOG SET &amp; START REST (${ex.rest}S)</button>
    ${needsRpe ? rpePickerHTML(cardId, t.logs.length-1) : ''}
    <div class="rest-panel ${isResting?'show':''}">
      <div><div class="restlabel">Rest</div><div class="resttime" id="${cardId}-resttime">${isResting?fmt(activeRest.remaining):'00:00'}</div></div>
      <div class="rest-adjust-row">
        <button class="iconbtn" onclick="adjustActiveRest(-15)">−15s</button>
        <button class="iconbtn" onclick="adjustActiveRest(30)">+30s</button>

function liveAdjust(cardId, direction){

  let newV = v * (1 + factor);
  newV = Math.max(0, Math.round(newV / 2.5) * 2.5);
  el.value = newV;
  updatePlateCalc(cardId);
  const note = document.getElementById(cardId+'-live-note');

    note.style.display = 'block';

    note._t = setTimeout(()=>{ note.style.display = 'none'; }, 2500);

}

/* ================= Audio / haptic ================= */
function ping(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    o.start(); o.stop(ctx.currentTime+0.4);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(200);
}

/* ================= Simple tracker init (bodyweight/band/TRX/medball) ================= */
function initSimpleTracker(cardId, totalSets, restSec){

/* ================= Rich load/reps/RPE tracker + plate calculator ================= */
function stepInput(id, delta, min, cardId){
  const el = document.getElementById(id);
  if(!el) return;
  let v = (parseFloat(el.value)||0) + delta;
  v = Math.max(min, v);
  el.value = Number.isInteger(delta) ? Math.round(v) : v;
  if(cardId) updatePlateCalc(cardId);
}
function calcPlates(total, bar){
  bar = bar || 20;
  let perSide = (total - bar) / 2;
  const avail = [25,20,15,10,5,2.5,1.25];
  const used = [];
  if(perSide > 0){
    for(const p of avail){
      const c = Math.floor((perSide + 1e-6) / p);
      if(c > 0){ used.push([p,c]); perSide -= c*p; }
    }
  }
  return {used, remainder: Math.max(perSide,0)};
}
function updatePlateCalc(cardId){
  const plateEl = document.getElementById(cardId+'-plates');
  if(!plateEl) return;
  const loadEl = document.getElementById(cardId+'-load');
  if(!loadEl) return;
  const total = parseFloat(loadEl.value) || 0;
  if(total <= 20){ plateEl.innerHTML = `<span class="barlabel">BAR: 20KG</span><br>Bar only, or below bar weight.`; return; }
  const {used, remainder} = calcPlates(total, 20);
  const desc = used.map(([p,c])=>`${c}× ${p}kg`).join(', ');
  plateEl.innerHTML = `<span class="barlabel">BAR: 20KG</span><br>Load each side with: <b>${desc || 'none'}</b>${remainder>0.05 ? ` <span style="color:var(--text-dim)">(+${remainder.toFixed(1)}kg not exactly loadable)</span>` : ''}`;
}
function initRichTracker(cardId, ex){
  if(!richTrackers[cardId]) richTrackers[cardId] = {total: ex.sets, current: 0, rest: ex.rest, logs: []};
  if(ex.barbell) updatePlateCalc(cardId);
}
function onLogSet(cardId){
  const t = richTrackers[cardId];
  if(!t) return;
  const loadEl = document.getElementById(cardId+'-load');
  const repsEl = document.getElementById(cardId+'-reps');
  if(!loadEl || !repsEl) return;
  t.logs.push({weight: parseFloat(loadEl.value)||0, reps: parseFloat(repsEl.value)||0, rpe: null});
  t.current++;
  t.adjustNote = null;
  saveState();
  if(t.current < t.total) startActiveRest(cardId, t.rest);
  else renderMain();
}
function computeAutoAdjust(rpe, currentWeight){
  const r = parseFloat(rpe);
  let factor = 0, label = null;
  if(r >= 10){ factor = -0.10; label = 'Reduced'; }
  else if(r >= 9){ factor = -0.05; label = 'Reduced'; }
  else if(r >= 8.5){ factor = 0; }
  else if(r >= 8){ factor = 0.025; label = 'Nudged up'; }
  else { factor = 0.075; label = 'Increased'; }
  if(factor === 0 || !currentWeight) return {weight: currentWeight, note: null};
  let newWeight = currentWeight * (1 + factor);
  newWeight = Math.max(0, Math.round(newWeight / 2.5) * 2.5);
  if(newWeight === currentWeight) return {weight: currentWeight, note: null};
  const pct = Math.abs(Math.round(factor * 1000) / 10);
  return {weight: newWeight, note: `${label} to ${newWeight}kg for your next set (${factor<0?'−':'+'}${pct}%) based on how that felt`};
}
function onRpeSelected(cardId, idx, rpe){
  const t = richTrackers[cardId];
  if(!t || !t.logs[idx]) return;
  t.logs[idx].rpe = rpe;
  const adj = computeAutoAdjust(rpe, t.logs[idx].weight);
  t.suggestedNext = adj.weight;
  t.adjustNote = adj.note;
  saveState();
  renderMain();
}
function quickFeedback(cardId, idx, level){
  // level: 'too_much' | 'just_right' | 'too_light'
  const rpeMap = {too_much:'10', just_right:'8', too_light:'6'};
  onRpeSelected(cardId, idx, rpeMap[level]);
}

/* ================= Unified active-rest engine (shared by HUD/REST screens) ================= */
function startActiveRest(cardId, sec){
  if(activeRest) clearInterval(activeRest.interval);
  activeRest = {cardId, remaining: sec, total: sec, interval: null};
  activeRest.interval = setInterval(()=>{
    if(!activeRest) return;
    activeRest.remaining--;
    if(activeRest.remaining <= 0){
      clearInterval(activeRest.interval);
      ping();
      activeRest = null;
    }
    renderMain();
  }, 1000);
  renderMain();
}
function skipActiveRest(){
  if(!activeRest) return;
  clearInterval(activeRest.interval);
  activeRest = null;
  renderMain();
}

const cardioTimers = {};
function initCardioTimer(id, sec){ cardioTimers[id] = {remaining:sec, total:sec, interval:null, running:false}; }
function cardioTick(id){
  const t = cardioTimers[id]; t.remaining--;
  document.getElementById(id+'-time').textContent = fmt(Math.max(t.remaining,0));
  if(t.remaining <= 0){ clearInterval(t.interval); t.running=false; ping(); }
}
function cardioStart(id){ const t=cardioTimers[id]; if(t.running) return; t.running=true; t.interval=setInterval(()=>cardioTick(id),1000); }
function cardioPause(id){ const t=cardioTimers[id]; clearInterval(t.interval); t.running=false; }

/* ================= Warm-up/cool-down/stretch minis ================= */
/* ================= Warm-up/cool-down/stretch mini timers (shared state, HUD + PLAN) ================= */
let activeMini = null; // {id, remaining, total, interval}
const minisDone = new Set();
function startMini(id, sec){
  if(activeMini && activeMini.id === id) return;
  if(activeMini) clearInterval(activeMini.interval);
  activeMini = {id, remaining: sec, total: sec, interval: null};
  activeMini.interval = setInterval(()=>{
    if(!activeMini) return;
    activeMini.remaining--;
    if(activeMini.remaining <= 0){
      clearInterval(activeMini.interval);
      minisDone.add(id);
      activeMini = null;
      ping();
      saveState();
    }
    renderMain();
  }, 1000);
  renderMain();
}
function skipMini(id){
  minisDone.add(id);
  if(activeMini && activeMini.id === id){ clearInterval(activeMini.interval); activeMini = null; }
  saveState();
  renderMain();
}

/* ================= Session stopwatch ================= */
let sw = {seconds:0, interval:null, running:false};
function swTick(){ sw.seconds++; const el=document.getElementById('stopwatch-time'); if(el) el.textContent = fmt(sw.seconds); }
function swToggle(){
  const btn = document.getElementById('sw-toggle');
  if(sw.running){ clearInterval(sw.interval); sw.running=false; btn.textContent='Start'; }
  else { sw.interval=setInterval(swTick,1000); sw.running=true; btn.textContent='Pause'; }
}
function swReset(){
  clearInterval(sw.interval); sw.seconds=0; sw.running=false;
  const t=document.getElementById('stopwatch-time'); if(t) t.textContent='00:00';
  const b=document.getElementById('sw-toggle'); if(b) b.textContent='Start';
}

/* ================= Boot ================= */
const STORAGE_KEY = 'reset_app_state_v1';
function saveState(){
  try{
    const state = {
      profile, equipment: Array.from(equipmentSelected),
      richTrackers, simpleTrackers, fuelLog, waterMl,
      minisDone: Array.from(minisDone), activeDay,
      imageOverrides, lastActiveDate: new Date().toDateString(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* storage unavailable — app still works, just won't remember */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    // Profile, equipment and custom images are durable settings — always restore them.
    Object.assign(profile, s.profile||{});
    equipmentSelected = new Set(s.equipment||[]);
    Object.assign(imageOverrides, s.imageOverrides||{});

    // Workout/set/nutrition PROGRESS only carries over within the same calendar day —
    // a new day means a fresh cycle, not yesterday's completed sets still showing done.
    const today = new Date().toDateString();
    if(s.lastActiveDate === today){
      if(s.activeDay) activeDay = s.activeDay; // same calendar day: resume wherever you left off
      Object.assign(richTrackers, s.richTrackers||{});
      Object.assign(simpleTrackers, s.simpleTrackers||{});
      (s.minisDone||[]).forEach(id=>minisDone.add(id));
      fuelLog = s.fuelLog||[];
      waterMl = s.waterMl||0;
    } else {
      activeDay = todayDayId(); // new day: jump straight to today's actual workout
    }
    return true;
  }catch(e){ return false; }
}
function clearSavedState(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}

if(window.__savedOverrides && window.__savedOverrides.equipment){
  regeneratePlans(); phase = "app";
} else if(loadState() && profile.weight){
  regeneratePlans(); phase = "app";
}
renderHeader();
renderMain();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
